version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Production Spatial Database (PostgreSQL 16 + PostGIS 3.4)
  # ----------------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: chargeatlas_db
    restart: always
    environment:
      POSTGRES_DB: chargeatlas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chargeatlas_secure_password_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chargeatlas_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chargeatlas_net

  # ----------------------------------------------------------------------------
  # 2. FastAPI ASGI Geospatial Intelligence Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chargeatlas_backend
    restart: always
    environment:
      APP_NAME: "ChargeAtlas India"
      APP_ENV: "production"
      DEBUG: "false"
      API_V1_STR: "/api/v1"
      SECRET_KEY: ${SECRET_KEY:-chargeatlas_production_secret_key_8896}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-chargeatlas_admin_key_2026}
      DB_ENGINE_MODE: "postgres"
      DB_HOST: "db"
      DB_PORT: 5432
      DB_NAME: "chargeatlas_db"
      DB_USER: "postgres"
      DB_PASSWORD: ${DB_PASSWORD:-chargeatlas_secure_password_2026}
      SYNTHETIC_DATA_MODE: "false"
      ALLOWED_ORIGINS: "http://localhost,http://localhost:5173,http://localhost:80"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - chargeatlas_net

  # ----------------------------------------------------------------------------
  # 3. React / MapLibre Production Web Frontend (Nginx Static + Reverse Proxy)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chargeatlas_frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - chargeatlas_net

volumes:
  pgdata:
    driver: local

networks:
  chargeatlas_net:
    driver: bridge

